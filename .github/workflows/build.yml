name: Build Fluffy Puppy APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Unzip theme project
        run: |
          rm -rf theme
          mkdir theme
          unzip -q Fluffy_Puppy_Android_Source.zip -d theme
          echo "Project contents:"
          find theme -maxdepth 2 -type f | head -50

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: theme
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluffy-Puppy-APK
          path: theme/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
