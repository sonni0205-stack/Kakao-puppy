name: Build Fluffy Puppy APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip theme project
        run: |
          rm -rf theme
          mkdir theme
          unzip -q Fluffy_Puppy_Android_Source.zip -d theme

      - name: Fix duplicate app_name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for f in Path("theme").rglob("res/values/strings.xml"):
              tree = ET.parse(f)
              root = tree.getroot()

              found = False
              changed = False

              for element in list(root):
                  if element.tag == "string" and element.get("name") == "app_name":
                      if not found:
                          found = True
                      else:
                          root.remove(element)
                          changed = True

              if changed:
                  tree.write(
                      f,
                      encoding="utf-8",
                      xml_declaration=True
                  )
                  print("Fixed duplicate app_name:", f)
              else:
                  print("Checked:", f)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: theme
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluffy-Puppy-APK
          path: theme/app/build/
